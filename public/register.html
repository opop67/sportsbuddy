<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opret konto — Sportsbuddy</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="register">
    <div class="page-shell">
      <div class="card">
        <h1>Opret konto</h1>
        <p class="lead">
          Vælg et unikt navn og en adgangskode. Efter oprettelse er du logget ind
          med det samme.
        </p>
        <p id="msg" class="msg" role="alert"></p>
        <form id="form" novalidate>
          <div class="field">
            <label for="username">Navn</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Fx Mette"
              required
              minlength="2"
              maxlength="80"
            />
          </div>
          <div class="field">
            <label for="password">Adgangskode</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Mindst 6 tegn"
              required
              minlength="6"
            />
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="btn-submit">
              Opret konto
            </button>
            <a class="btn btn-secondary" href="/login.html">Tilbage til log ind</a>
          </div>
        </form>
        <p class="link-row">
          Har du allerede en konto? <a href="/login.html">Log ind</a>
        </p>
      </div>
    </div>
    <script src="/js/api.js"></script>
  </body>
</html>
