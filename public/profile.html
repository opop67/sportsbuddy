<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile — Sportsbuddy</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="app-page" data-page="profile">
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="/home.html" aria-label="Sportsbuddy home">
          <img
            class="brand-logo-img"
            src="/img/logo.png"
            alt="Sportsbuddy logo"
          />
        </a>
        <div class="header-center-nav" aria-label="Primary page navigation">
          <div class="header-nav-group">
            <a href="/home.html" class="header-nav-btn">Home</a>
            <a href="/arrangements.html" class="header-nav-btn">Arrangements</a>
          </div>
          <p class="header-slogan">More Than Fitness!</p>
          <div class="header-nav-group">
            <a href="/levels.html" class="header-nav-btn">Levels</a>
            <a href="/badges.html" class="header-nav-btn">Badges</a>
          </div>
        </div>

        <div class="header-actions">
          <button type="button" class="icon-btn" aria-label="Notifikationer">
            <span aria-hidden="true">🔔</span>
          </button>
          <div class="menu-wrap">
            <button
              type="button"
              class="icon-btn menu-btn"
              id="btn-menu"
              aria-label="Menu"
              aria-expanded="false"
              aria-controls="main-menu"
            >
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </button>
            <nav class="menu-dropdown" id="main-menu" hidden>
              <a href="/home.html" class="menu-item">Home</a>
              <a href="/profile.html" class="menu-item">Profile</a>
              <a href="/arrangements.html" class="menu-item">Arrange session</a>
              <button type="button" class="menu-item menu-logout" id="btn-logout">
                Log ud
              </button>
            </nav>
          </div>
        </div>
      </header>

      <main class="profile-main">
        <section class="profile-card">
          <div class="profile-hero">
            <div class="profile-avatar" id="profile-avatar">S</div>
            <button type="button" class="btn btn-secondary profile-photo-btn">
              Add photo
            </button>
          </div>

          <p id="profile-msg" class="msg" role="alert"></p>
          <form id="profile-form">
            <div class="field">
              <label for="profile-name">Player name</label>
              <input id="profile-name" name="name" type="text" required />
            </div>
            <div class="field">
              <label for="profile-age">Age</label>
              <input id="profile-age" name="age" type="text" required placeholder="Fx 27" />
            </div>
            <div class="field">
              <label for="profile-bio">Bio (sports interests / goals)</label>
              <textarea
                id="profile-bio"
                name="bio"
                rows="4"
                required
                placeholder="Fortael kort om dine sportsinteresser og maal."
              ></textarea>
            </div>
            <div class="field">
              <label for="profile-sport">Priority sport</label>
              <select id="profile-sport" name="prioritySport" required>
                <option value="">Vaelg sport</option>
                <option>Padel</option>
                <option>Football</option>
                <option>Badminton</option>
                <option>Basketball</option>
                <option>Tennis</option>
                <option>Volleyball</option>
              </select>
            </div>
            <div class="profile-actions">
              <button type="submit" class="btn btn-primary">Save profile</button>
              <button type="button" class="btn btn-secondary">Share profile</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="/js/api.js"></script>
  </body>
</html>
